<div style="background:#f4f1f8;padding:32px 16px;font-family:Arial,Helvetica,sans-serif">
  <div style="max-width:520px;margin:0 auto">
    <img src="{{ .SiteURL }}/brand/logo-completo.png" alt="En Modo Video" height="36" style="display:block;height:36px;margin:0 0 20px 8px">
    <div style="background:#ffffff;border:1px solid #e8e2f0;border-radius:20px;padding:36px 32px">
      <h1 style="margin:0 0 16px;font-size:24px;color:#1f1530">Crea una nueva contraseña 🔑</h1>
      <p style="margin:0 0 16px;font-size:16px;line-height:1.6;color:#1f1530">Recibimos una solicitud para cambiar la contraseña de tu cuenta en En Modo Video. Pulsa el botón para crear una nueva.</p>
      <p style="margin:28px 0">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;padding:14px 28px;background:#f4644e;color:#ffffff;font-weight:bold;font-size:16px;text-decoration:none;border-radius:999px">Crear nueva contraseña</a>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#6b6280">El enlace vence en 1 hora. Si no pediste este cambio, ignora este correo: tu contraseña sigue igual.</p>
    </div>
  </div>
</div>
